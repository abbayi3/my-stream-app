<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0e12; color: #e1e4ed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; overflow-x: hidden; }

        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 199; }
        .sidebar { width: 230px; background: #13151c; border-right: 1px solid #1f222e; display: flex; flex-direction: column; padding: 20px; gap: 10px; position: fixed; top: 0; bottom: 0; left: -240px; z-index: 200; transition: left 0.3s ease; }
        .sidebar.active { left: 0; }
        .sidebar-overlay.active { display: block; }
        .sidebar .brand { font-weight: 900; font-size: 22px; color: #fff; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar a { color: #a0a6b8; font-size: 14px; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: #e50914; }
        .sidebar .menu-divider { height: 1px; background: #1f222e; margin: 10px 0; }

        .main-wrapper { padding: 15px 15px 50px 15px; width: 100%; max-width: 1200px; margin: 0 auto; }

        .top-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        .left-header { display: flex; align-items: center; gap: 12px; }
        .menu-btn { background: #191c26; border: 1px solid #272b3c; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .logo-text { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -1px; }
        .logo-text span { color: #e50914; }
        
        .search-container { flex: 1; max-width: 400px; position: relative; }
        .search-container input { width: 100%; background: #191c26; border: 1px solid #272b3c; color: #fff; padding: 8px 12px 8px 34px; border-radius: 20px; font-size: 12px; outline: none; }
        .search-container input:focus { border-color: #e50914; }
        .search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6c7285; font-size: 11px; }

        .performers-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }
        .performers-row::-webkit-scrollbar { display: none; }
        .performer-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; position: relative; }
        
        .avatar-box { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #e50914; background: #191c26; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        
        .performer-name { font-size: 10px; color: #a0a6b8; max-width: 65px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
        .btn-del-performer { position: absolute; top: -2px; right: -2px; background: #e50914; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: none; z-index: 10; }
        .performer-item:hover .btn-del-performer { display: flex; align-items: center; justify-content: center; }

        .categories-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .categories-row::-webkit-scrollbar { display: none; }
        .badge { background: #191c26; border: 1px solid #272b3c; color: #c2c7d6; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 16px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .badge.active, .badge:hover { background: #e50914; border-color: #e50914; color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        @media(min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; } }
        .card { background: #13151c; border: 1px solid #1f222e; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .thumb-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; cursor: pointer; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .duration-tag { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.85); font-size: 9px; font-weight: 700; color: #fff; padding: 2px 5px; border-radius: 3px; font-family: monospace; }
        .card-details { padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .card-title { font-size: 12px; font-weight: 600; color: #e1e4ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; cursor: pointer; }
        .btn-delete { color: #525868; background: none; border: none; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { color: #e50914; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
        .modal-body { background: #13151c; border: 1px solid #272b3c; border-radius: 12px; width: 100%; max-width: 400px; padding: 18px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1f222e; padding-bottom: 8px; }
        .modal-header h3 { font-size: 14px; font-weight: 700; }
        .close-btn { color: #888; background: none; border: none; font-size: 18px; cursor: pointer; }
        .form-inputs { display: flex; flex-direction: column; gap: 10px; }
        .form-inputs input { width: 100%; background: #191c26; border: 1px solid #272b3c; color: #fff; padding: 9px; border-radius: 6px; font-size: 12px; outline: none; }
        .form-inputs input:focus { border-color: #e50914; }
        .form-inputs label { font-size: 11px; color: #8c92a4; margin-top: 4px; }
        .file-input { background: #191c26; border: 1px solid #272b3c; padding: 6px; border-radius: 6px; font-size: 11px; color: #a0a6b8; cursor: pointer; }
        .btn-submit { background: #e50914; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; margin-top: 5px; }

        .player-wrapper { width: 100%; max-width: 800px; background: #000; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid #272b3c; }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }
        .close-player-btn { position: absolute; top: 10px; right: 14px; color: #fff; font-size: 20px; cursor: pointer; z-index: 10; font-weight: bold; }
    </style>
</head>
<body>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="sidebar">
        <div class="brand">
            <span>stream.hub</span>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <a class="active"><i class="fa-solid fa-house"></i> Home</a>
        <a><i class="fa-solid fa-compass"></i> Explore</a>
        
        <div class="menu-divider"></div>
        <a onclick="openAddVideoFromMenu()"><i class="fa-solid fa-plus-circle"></i> Add Video</a>
        <a onclick="openAddActorFromMenu()"><i class="fa-solid fa-user-plus"></i> Add Actor Circle</a>
        <div class="menu-divider"></div>

        <a><i class="fa-solid fa-bookmark"></i> Bookmarks</a>
        <a><i class="fa-solid fa-heart"></i> Favorites</a>
        <a><i class="fa-solid fa-clock"></i> History</a>
    </div>

    <div class="main-wrapper">
        <div class="top-header">
            <div class="left-header">
                <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="logo-text">stream<span>.hub</span></div>
            </div>
            
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="renderGrid()" placeholder="Search videos...">
            </div>
        </div>

        <div id="performersRow" class="performers-row"></div>

        <div class="categories-row">
            <span class="badge active" onclick="filterByTag('')">All</span>
            <span class="badge" onclick="filterByTag('Naughty America')">Naughty America</span>
            <span class="badge" onclick="filterByTag('Porn Force')">Porn Force</span>
            <span class="badge" onclick="filterByTag('Anal')">Anal</span>
            <span class="badge" onclick="filterByTag('Japanese')">Japanese</span>
        </div>

        <div id="videoGrid" class="grid"></div>
    </div>

    <!-- ADD VIDEO MODAL -->
    <div id="addModal" class="modal">
        <div class="modal-body">
            <div class="modal-header">
                <h3>Add Video Entry</h3>
                <button onclick="toggleAddModal()" class="close-btn">✕</button>
            </div>
            <div class="form-inputs">
                <input type="text" id="addTitle" placeholder="Video Title">
                <input type="text" id="addCode" placeholder="Doodstream Code or Link">
                <label>Thumbnail from Gallery:</label>
                <input type="file" id="addPosterFile" class="file-input" accept="image/*">
                <input type="text" id="addDuration" placeholder="Duration (e.g. 18:45)">
                <button id="saveVideoBtn" onclick="saveToSupabase()" class="btn-submit">Save Video</button>
            </div>
        </div>
    </div>

    <!-- ADD ACTOR MODAL -->
    <div id="performerModal" class="modal">
        <div class="modal-body">
            <div class="modal-header">
                <h3>Add Actor Profile</h3>
                <button onclick="togglePerformerModal()" class="close-btn">✕</button>
            </div>
            <div class="form-inputs">
                <input type="text" id="addPerfName" placeholder="Actor / Performer Name">
                <label>Actor Photo from Gallery:</label>
                <input type="file" id="addPerfFile" class="file-input" accept="image/*">
                <button id="savePerfBtn" onclick="savePerformer()" class="btn-submit">Save Actor</button>
            </div>
        </div>
    </div>

    <div id="playerModal" class="modal">
        <div class="player-wrapper">
            <span onclick="closeModal()" class="close-player-btn">✕</span>
            <iframe id="modalFrame" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vpkuposuvezk1gefplkb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwa3Vwb3N1dmV6a2lnZWZwbGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Nzk0NjgsImV4cCI6MjEwMzA1NTQ2OH0.fkCTYyq3AVkvV8lsWZdAq3C1GmJVnFC8th_PcFpFV48";
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let videos = [];
        let performers = [];

        async function uploadImageToSupabase(file) {
            try {
                const fileName = `img_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.jpg`;
                const { data, error } = await db.storage.from('posters').upload(fileName, file);
                
                if (error) {
                    console.error("Storage upload error:", error.message);
                    return null;
                }

                const { data: publicURLData } = db.storage.from('posters').getPublicUrl(fileName);
                return publicURLData.publicUrl;
            } catch (err) {
                console.error("Upload exception:", err);
                return null;
            }
        }

        async function fetchVideos() {
            try {
                const { data, error } = await db.from('videos').select('*').order('id', { ascending: false });
                if (!error && data) { 
                    videos = data; 
                } else {
                    videos = JSON.parse(localStorage.getItem('offline_videos') || '[]');
                }
                renderGrid();
            } catch (err) { 
                videos = JSON.parse(localStorage.getItem('offline_videos') || '[]');
                renderGrid();
            }
        }

        async function fetchPerformers() {
            try {
                const { data, error } = await db.from('performers').select('*').order('id', { ascending: false });
                if (!error && data) {
                    performers = data;
                } else {
                    performers = JSON.parse(localStorage.getItem('actors_list') || '[]');
                }
                renderPerformers();
            } catch (err) {
                performers = JSON.parse(localStorage.getItem('actors_list') || '[]');
                renderPerformers();
            }
        }

        function renderPerformers() {
            const row = document.getElementById('performersRow');
            row.innerHTML = '';
            performers.forEach(p => {
                const item = document.createElement('div');
                item.className = 'performer-item';
                item.innerHTML = `
                    <button onclick="deletePerformer(event, ${p.id})" class="btn-del-performer">✕</button>
                    <div class="avatar-box" onclick="filterByTag('${p.name}')">
                        ${p.image_url ? `<img src="${p.image_url}" referrerpolicy="no-referrer">` : ''}
                    </div>
                    <span class="performer-name" onclick="filterByTag('${p.name}')">${p.name}</span>
                `;
                row.appendChild(item);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('videoGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = videos.filter(v => v.title && v.title.toLowerCase().includes(search));

            filtered.forEach(v => {
                const embedUrl = `https://dood.to/e/${v.file_code}`;
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div class="thumb-box" onclick="playVideo('${embedUrl}')">
                        <img src="${v.poster_url || 'https://via.placeholder.com/300x170?text=No+Poster'}" referrerpolicy="no-referrer" loading="lazy">
                        <span class="duration-tag">${v.duration || 'HD'}</span>
                    </div>
                    <div class="card-details">
                        <span class="card-title" onclick="playVideo('${embedUrl}')">${v.title}</span>
                        <button onclick="deleteRecord(${v.id})" class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAddVideoFromMenu() { toggleSidebar(); toggleAddModal(); }
        function openAddActorFromMenu() { toggleSidebar(); togglePerformerModal(); }

        async function savePerformer() {
            const name = document.getElementById('addPerfName').value.trim();
            const fileInput = document.getElementById('addPerfFile').files[0];
            const btn = document.getElementById('savePerfBtn');

            if(!name) return alert('Actor name is required!');

            btn.innerText = "Uploading...";
            let imageUrl = '';
            if (fileInput) {
                imageUrl = await uploadImageToSupabase(fileInput);
            }

            btn.innerText = "Saving...";
            try {
                const { error } = await db.from('performers').insert([{ name, image_url: imageUrl }]);
                if(error) {
                    performers.unshift({ id: Date.now(), name, image_url: imageUrl });
                    localStorage.setItem('actors_list', JSON.stringify(performers));
                }
            } catch(e) {
                performers.unshift({ id: Date.now(), name, image_url: imageUrl });
                localStorage.setItem('actors_list', JSON.stringify(performers));
            }
            
            btn.innerText = "Save Actor";
            document.getElementById('addPerfName').value = '';
            document.getElementById('addPerfFile').value = '';
            togglePerformerModal();
            fetchPerformers();
        }

        async function deletePerformer(e, id) {
            e.stopPropagation();
            if(confirm("Delete actor profile?")) {
                await db.from('performers').delete().eq('id', id);
                performers = performers.filter(p => p.id !== id);
                localStorage.setItem('actors_list', JSON.stringify(performers));
                renderPerformers();
            }
        }

        async function saveToSupabase() {
            const title = document.getElementById('addTitle').value.trim();
            const codeInput = document.getElementById('addCode').value.trim();
            const duration = document.getElementById('addDuration').value.trim();
            const fileInput = document.getElementById('addPosterFile').files[0];
            const btn = document.getElementById('saveVideoBtn');

            if (!title || !codeInput) return alert('Title and Code required!');
            const fileCode = codeInput.includes("dood") ? codeInput.split('/').pop() : codeInput;

            btn.innerText = "Uploading Image...";

            let posterUrl = '';
            if (fileInput) {
                posterUrl = await uploadImageToSupabase(fileInput);
            }

            btn.innerText = "Saving Video...";

            try {
                const { error } = await db.from('videos').insert([{ 
                    title, 
                    file_code: fileCode, 
                    poster_url: posterUrl, 
                    duration 
                }]);
                
                if (error) {
                    let localVideos = JSON.parse(localStorage.getItem('offline_videos') || '[]');
                    localVideos.unshift({ id: Date.now(), title, file_code: fileCode, poster_url: posterUrl, duration });
                    localStorage.setItem('offline_videos', JSON.stringify(localVideos));
                }

                btn.innerText = "Save Video";
                document.getElementById('addTitle').value = '';
                document.getElementById('addCode').value = '';
                document.getElementById('addPosterFile').value = '';
                document.getElementById('addDuration').value = '';
                toggleAddModal();
                fetchVideos();

            } catch(e) {
                let localVideos = JSON.parse(localStorage.getItem('offline_videos') || '[]');
                localVideos.unshift({ id: Date.now(), title, file_code: fileCode, poster_url: posterUrl, duration });
                localStorage.setItem('offline_videos', JSON.stringify(localVideos));
                
                btn.innerText = "Save Video";
                toggleAddModal();
                fetchVideos();
            }
        }

        async function deleteRecord(id) {
            if(confirm("Delete video?")) {
                await db.from('videos').delete().eq('id', id);
                let localVideos = JSON.parse(localStorage.getItem('offline_videos') || '[]');
                localVideos = localVideos.filter(v => v.id !== id);
                localStorage.setItem('offline_videos', JSON.stringify(localVideos));
                fetchVideos();
            }
        }

        function filterByTag(tag) { document.getElementById('searchInput').value = tag; renderGrid(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
        function toggleAddModal() { const m = document.getElementById('addModal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
        function togglePerformerModal() { const m = document.getElementById('performerModal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
        function playVideo(url) { document.getElementById('modalFrame').src = url; document.getElementById('playerModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalFrame').src = ''; document.getElementById('playerModal').style.display = 'none'; }

        window.onload = () => {
            fetchVideos();
            fetchPerformers();
        };
    </script>
</body>
</html>
