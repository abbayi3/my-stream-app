<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
*{ box-sizing:border-box; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; }
body{ background:#0d0e12; color:#e1e4ed; }
header{ height:65px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; background:#13151c; border-bottom:1px solid #1f222e; position:sticky; top:0; z-index:50; }
.logo{ font-size:22px; font-weight:900; color:white; letter-spacing:-1px; }
.logo span{ color:#e50914; }
.search-container{ position:relative; width:45%; max-width:260px; }
.search{ width:100%; padding:8px 12px 8px 34px; border-radius:20px; border:1px solid #272b3c; background:#191c26; color:white; outline:none; font-size:12px; }
.search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6c7285; font-size: 11px; }
.suggestions-box { position:absolute; top:45px; left:0; width:100%; background:#13151c; border:1px solid #272b3c; border-radius:10px; max-height:200px; overflow-y:auto; z-index:1000; display:none; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
.suggestion-item { padding:10px 12px; border-bottom:1px solid #1f222e; cursor:pointer; font-size:12px; color:#e1e4ed; }
.suggestion-item:hover { background:#e50914; color:white; }
.menuBtn{ border:1px solid #272b3c; background:#191c26; color:white; padding:8px 12px; border-radius:8px; font-size:16px; cursor:pointer; }
.sidebar{ position:fixed; top:0; left:-280px; width:260px; height:100%; background:#13151c; border-right:1px solid #1f222e; z-index:300; transition:left 0.3s ease; padding:20px; display:flex; flex-direction:column; justify-content:space-between; overflow-y:auto; }
.sidebar.active{ left:0; }
.sidebar-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:299; display:none; }
.sidebar-header{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1f222e; padding-bottom:15px; margin-bottom:15px; }
.sidebar-menu-list button{ width:100%; text-align:left; background:none; border:none; color:#a0a6b8; padding:12px 10px; border-radius:8px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:0.2s; }
.sidebar-menu-list button:hover{ background:#e50914; color:white; }
.performers-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }

.performer-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }

.performer-name { font-size: 10px; color: #a0a6b8; max-width: 65px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.categories-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
.categories-row::-webkit-scrollbar { display: none; }
.badge { background: #191c26; border: 1px solid #272b3c; color: #c2c7d6; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 16px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
.badge.active, .badge:hover { background: #e50914; border-color: #e50914; color: #fff; }
.section{ padding:15px 14px; }
.section-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.title{ font-size:18px; text-transform:capitalize; font-weight:bold; }
.see-more-btn{ color:#e50914; font-size:20px; font-weight:bold; cursor:pointer; user-select:none; }
.row{ display:flex; gap:13px; overflow-x:auto; scrollbar-width:none; }
.row::-webkit-scrollbar{ display:none; }
.movie{ width:150px; min-width:150px; cursor:pointer; background: #13151c; border: 1px solid #1f222e; border-radius: 8px; overflow: hidden; }
.poster{ width:100%; height:100px; object-fit:cover; background:#191c26; display: block; }

.movieMeta{ padding: 0 8px 8px 8px; color:#78838e; font-size:10px; text-transform:capitalize; }
.modal, .admin, .category-page{ position:fixed; inset:0; display:none; background:rgba(0,0,0,.92); z-index:100; }
.category-page{ background:#0d0e12; z-index:90; overflow-y:auto; }
.category-header{ height:65px; display:flex; align-items:center; gap:15px; padding:0 15px; background:#13151c; border-bottom:1px solid #1f222e; position:sticky; top:0; z-index:10; }
.back-btn{ background:none; border:none; color:white; font-size:22px; cursor:pointer; }
.category-title-head{ font-size:18px; font-weight:bold; text-transform:capitalize; }
.grid-container{ display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:12px; padding:15px; }
.grid-movie{ cursor:pointer; width:100%; background: #13151c; border: 1px solid #1f222e; border-radius: 8px; overflow: hidden; }
.grid-poster{ width:100%; height:100px; object-fit:cover; background:#191c26; }
.modal{ align-items:center; justify-content:center; padding:12px; }
.modalBox{ width:100%; max-width:600px; background:#13151c; border-radius:12px; overflow:hidden; position:relative; max-height:92vh; overflow-y:auto; border:1px solid #272b3c; }
.modalMediaContainer{ width:100%; aspect-ratio: 16/9; background:#000; position:relative; }
.modalImage{ width:100%; height:100%; object-fit:cover; display:block; }
.modalIframe{ width:100%; height:100%; border:0; display:none; }
.close-icon{ position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.7); color:white; border:0; width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer; z-index:10; }
.modalContent{ padding:16px; }
.modalContent h2{ font-size:18px; margin-bottom:8px; }
.action-btns{ display:flex; gap:10px; margin-top:15px; }
.btn-action{ flex:1; padding:10px; border:0; border-radius:7px; font-weight:bold; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; text-align:center; }
.watch-btn{ background:#e50914; color:white; }
.watchlist-btn{ background:#272b3c; color:white; }
.playlist-item{ display:flex; align-items:center; justify-content:space-between; background:#13151c; padding:10px 14px; margin-top:8px; border-radius:8px; border:1px solid #1f222e; }
.playlist-title{ font-size:13px; font-weight:bold; }
.delete-btn{ background:#e50914; color:white; border:0; padding:6px 10px; border-radius:5px; cursor:pointer; font-size:11px; }
.admin{ background:#0d0e12; z-index:400; overflow-y:auto; }
.adminHeader{ height:65px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; border-bottom:1px solid #1f222e; position:sticky; top:0; background:#13151c; }
.adminHeader h2{ color:#e50914; font-size:18px; }
.adminContent{ max-width:600px; margin:auto; padding:20px; }
.group{ margin-bottom:15px; }
.group label{ display:block; color:#a0a6b8; font-size:12px; margin-bottom:6px; }
.group input, .group textarea{ width:100%; padding:10px; background:#191c26; color:white; border:1px solid #272b3c; border-radius:8px; outline:none; font-size:12px; }
.preview{ width:100px; height:60px; object-fit:cover; border-radius:6px; margin-top:8px; display:none; }
.addBtn{ width:100%; padding:12px; border:0; border-radius:8px; background:#e50914; color:white; font-weight:bold; cursor:pointer; margin-top:5px; font-size:13px; }
.cancelBtn{ background:#525868; width:100%; padding:10px; border:0; border-radius:8px; color:white; font-weight:bold; cursor:pointer; margin-top:5px; display:none; font-size:12px; }
.status{ margin-top:12px; padding:10px; background:#191c26; border-radius:7px; color:#a0a6b8; font-size:12px; }
.admin-card-section{ background:#13151c; border-radius:10px; border:1px solid #1f222e; margin-bottom:15px; overflow:hidden; }
.accordion-header{ display:flex; justify-content:space-between; align-items:center; padding:15px; cursor:pointer; user-select:none; }
.accordion-header h3{ font-size:15px; margin:0; }
.accordion-icon{ font-size:13px; font-weight:bold; }
.accordion-body{ padding:15px; border-top:1px solid #1f222e; display:none; }
.adminItem{ display:flex; align-items:center; gap:10px; background:#191c26; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #272b3c; }
.adminThumb{ width:60px; height:35px; object-fit:cover; border-radius:4px; }
.adminInfo{ flex:1; font-size:12px; }
.adminBtns{ display:flex; gap:6px; }
.delete{ background:#e50914; color:white; border:0; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px; }
footer{ text-align:center; color:#525868; padding:30px; font-size:11px; }
</style>
</head>

<script>
const SUPABASE_URL = "https://vpkuposuvezk1gefplkb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwa3Vwb3N1dmV6a2lnZWZwbGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Nzk0NjgsImV4cCI6MjEwMzA1NTQ2OH0.fkCTYyq3AVkvV8lsWZdAq3C1GmJVnFC8th_PcFpFV48";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let movies = JSON.parse(localStorage.getItem('offline_videos') || '[]');
let performers = JSON.parse(localStorage.getItem('actors_list') || '[]');
let selectedMovie = null;
let watchlist = [];

// Instantly render cached data so page loads without delay
renderPerformers();
renderMovies();

// Then fetch fresh data from Supabase in background
async function fetchFreshData(){
  try {
    const res = await db.from("videos").select("*").order("id", {ascending:false});

    }
  } catch(e){}

  renderPerformers();
  renderMovies();

fetchFreshData();

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if (sidebar.classList.contains("active")) {
    sidebar.classList.remove("active");
    overlay.style.display = "none";
  } else {
    sidebar.classList.add("active");
    overlay.style.display = "block";
  }
}

function openAdminSecretly() {
  toggleSidebar();
  const pin = prompt("Enter PIN:");
  if(pin === "7890") {
    document.getElementById("adminPanel").style.display = "block";
  } else if(pin !== null) {
    alert("Invalid PIN!");
  }
}

function closeAdmin(){ document.getElementById("adminPanel").style.display="none"; }

function toggleAccordion(bodyId, iconId){
  const body = document.getElementById(bodyId);
  const icon = document.getElementById(iconId);
  if(body.style.display === "block"){
    body.style.display = "none";
    icon.textContent = "▼";
  } else {
    body.style.display = "block";
    icon.textContent = "▲";
  }
}

function parseStreamtapeId(input) {
  if (!input) return '';
  let target = input.trim();
  const srcMatch = target.match(/src=["']([^"']+)["']/);
  if (srcMatch) target = srcMatch[1];
  const match = target.match(/(?:streamtape\.com\/(?:v|e)\/)([a-zA-Z0-9]+)/);
  if (match && match[1]) return match[1];
  return target.split('/')[0].trim();
}

document.getElementById("movieImage").addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const preview = document.getElementById("preview");
    preview.src = e.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

document.getElementById("actorImage").addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const preview = document.getElementById("actorPreview");
    preview.src = e.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

function renderPerformers() {
  const row = document.getElementById('performersRow');
  row.innerHTML = '';
  performers.forEach(p => {
    const item = document.createElement('div');
    item.className = 'performer-item';
    item.innerHTML = `
      <div class="avatar-box" onclick="filterByTag('${p.name}')">
        ${p.image_url ? `<img src="${p.image_url}" referrerpolicy="no-referrer">` : '<i class="fa-solid fa-user" style="color:#555"></i>'}
      </div>
      <span class="performer-name" onclick="filterByTag('${p.name}')">${p.name}</span>
    `;
    row.appendChild(item);
  });
}

function renderMovies(){
  const container = document.getElementById("dynamicCategoriesContainer");
  container.innerHTML = "";

  let allCategories = [...new Set(movies.map(m => m.category ? m.category.toLowerCase().trim() : "general"))];

  allCategories.forEach(cat => {
    const categoryMovies = movies.filter(m => (m.category ? m.category.toLowerCase().trim() : "general") === cat);

    if (categoryMovies.length > 0) {
      const section = document.createElement("section");
      section.className = "section";
      
      const headerDiv = document.createElement("div");
      headerDiv.className = "section-header";

      const titleDiv = document.createElement("div");
      titleDiv.className = "title";
      titleDiv.textContent = cat;

      const seeMoreBtn = document.createElement("div");
      seeMoreBtn.className = "see-more-btn";
      seeMoreBtn.innerHTML = "›";
      seeMoreBtn.onclick = function(){ openFilteredPage(cat); };

      headerDiv.appendChild(titleDiv);
      headerDiv.appendChild(seeMoreBtn);
      section.appendChild(headerDiv);

      const rowDiv = document.createElement("div");
      rowDiv.className = "row";

      categoryMovies.forEach(movie => {
        rowDiv.appendChild(createCard(movie));
      });

      section.appendChild(rowDiv);
      container.appendChild(section);
    }
  });

  renderAdmin();
  renderWatchlist();
}

function openFilteredPage(catValue){
  const page = document.getElementById("categoryPage");
  const titleHead = document.getElementById("categoryPageTitle");
  const grid = document.getElementById("categoryGrid");

  titleHead.textContent = catValue;
  grid.innerHTML = "";

  const filteredItems = movies.filter(m => (m.category ? m.category.toLowerCase().trim() : "general") === catValue || (m.title && m.title.toLowerCase().includes(catValue)));

  filteredItems.forEach(movie => {
    const card = document.createElement("div");
    card.className = "grid-movie";
    card.onclick = function(){ openMovie(movie); };
    card.innerHTML = `
      <img class="grid-poster" src="${movie.poster_url || movie.thumbnail_url}" loading="lazy">
      <div class="movieName">${escapeHTML(movie.title)}</div>
    `;
    grid.appendChild(card);
  });

  page.style.display = "block";
}

function closeCategoryPage(){
  document.getElementById("categoryPage").style.display = "none";
}

function createCard(movie){
  const card = document.createElement("div");
  card.className = "movie";
  card.onclick = function(){ openMovie(movie); };

  card.innerHTML = `
    <img class="poster" src="${movie.poster_url || movie.thumbnail_url}" loading="lazy">
    <div class="movieName">${escapeHTML(movie.title)}</div>
    <div class="movieMeta">HD Quality</div>
  `;
  return card;
}

function escapeHTML(text){
  return String(text||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

async function addOrUpdateMovie(){
  const title = document.getElementById("movieTitle").value.trim();
  const codeInput = document.getElementById("movieLink").value.trim();
  const category = document.getElementById("movieCategory").value.trim() || "general";
  const file = document.getElementById("movieImage").files[0];

  if(!title || !codeInput) return alert("Title and Code/Link required!");

  const fileCode = parseStreamtapeId(codeInput);
  let posterUrl = "";

  if(file){
    const reader = new FileReader();
    posterUrl = await new Promise(resolve => {
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  const newObj = { id: Date.now(), title, file_code: fileCode, poster_url: posterUrl, category };
  movies.unshift(newObj);
  localStorage.setItem('offline_videos', JSON.stringify(movies));
  
  try {
    await db.from("videos").insert([{ title, file_code: fileCode, poster_url: posterUrl, category }]);
  } catch(e){}

  document.getElementById("movieTitle").value = "";
  document.getElementById("movieLink").value = "";
  document.getElementById("movieCategory").value = "";
  document.getElementById("movieImage").value = "";
  document.getElementById("preview").style.display = "none";
  
  renderMovies();
  alert("✅ Video Added!");
}

async function saveActor(){
  const name = document.getElementById("actorName").value.trim();
  const file = document.getElementById("actorImage").files[0];
  if(!name) return alert("Actor name required!");

  let imageUrl = "";
  if(file){
    const reader = new FileReader();
    imageUrl = await new Promise(resolve => {
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  performers.unshift({ id: Date.now(), name, image_url: imageUrl });
  localStorage.setItem('actors_list', JSON.stringify(performers));
  try {
    await db.from("performers").insert([{ name, image_url: imageUrl }]);
  } catch(e){}

  document.getElementById("actorName").value = "";
  document.getElementById("actorImage").value = "";
  document.getElementById("actorPreview").style.display = "none";
  renderPerformers();
  alert("✅ Actor Added!");
}

function renderAdmin(){
  const box = document.getElementById("adminMovies");
  box.innerHTML = "";
  movies.forEach(item => {
    const div = document.createElement("div");
    div.className = "adminItem";
    div.innerHTML = `
      <img class="adminThumb" src="${item.poster_url || item.thumbnail_url}">
      <div class="adminInfo">
        <strong>${escapeHTML(item.title)}</strong><br>
        <small style="color:#a0a6b8;">${escapeHTML(item.category || 'general')}</small>
      </div>
      <div class="adminBtns">
        <button class="delete" onclick="deleteItem(${item.id})">Delete</button>
      </div>
    `;
    box.appendChild(div);
  });
}

async function deleteItem(id){
  if(!confirm("Delete video?")) return;
  await db.from("videos").delete().eq("id", id);
  movies = movies.filter(m => m.id !== id);
  localStorage.setItem('offline_videos', JSON.stringify(movies));
  renderMovies();
}

function openMovie(movie){
  selectedMovie = movie;
  document.getElementById("modalTitle").textContent = movie.title;
  const imgElement = document.getElementById("modalImage");
  const iframeElement = document.getElementById("modalTrailerFrame");

  iframeElement.style.display = "none";
  iframeElement.src = "";
  imgElement.style.display = "block";
  imgElement.src = movie.poster_url || movie.thumbnail_url;

  updateWatchlistBtn();
  document.getElementById("movieModal").style.display = "flex";
}

function handleWatchClick(){
  if(!selectedMovie) return;
  const cleanCode = parseStreamtapeId(selectedMovie.file_code);
  const embedUrl = `https://streamtape.com/e/${cleanCode}`;

  document.getElementById("modalImage").style.display = "none";
  const iframeElement = document.getElementById("modalTrailerFrame");
  iframeElement.style.display = "block";
  iframeElement.src = embedUrl;
}

function closeMovie(){ 
  document.getElementById("movieModal").style.display = "none"; 
  document.getElementById("modalTrailerFrame").src = "";
}

function toggleWatchlist(){
  if(!selectedMovie) return;
  const index = watchlist.findIndex(m => m.id === selectedMovie.id);
  if(index === -1) watchlist.push(selectedMovie);
  else watchlist.splice(index, 1);
  updateWatchlistBtn();
  renderWatchlist();
}

function updateWatchlistBtn(){
  if(!selectedMovie) return;
  const exists = watchlist.some(m => m.id === selectedMovie.id);
  const btn = document.getElementById("watchlistToggleBtn");
  btn.textContent = exists ? "✓ Added" : "+ Watchlist";
  btn.style.background = exists ? "#e50914" : "#272b3c";
}

function renderWatchlist(){
  const box = document.getElementById("playlistList");
  if(watchlist.length === 0){
    box.innerHTML = `<p style="color:#525868; font-size:12px;">No videos added.</p>`;
    return;
  }
  box.innerHTML = "";
  watchlist.forEach(m => {
    const item = document.createElement("div");
    item.className = "playlist-item";
    item.innerHTML = `
      <span class="playlist-title">${escapeHTML(m.title)}</span>
      <button class="delete-btn" onclick="removeFromWatchlist(${m.id})">Delete</button>
    `;
    box.appendChild(item);
  });
}

function removeFromWatchlist(id){
  watchlist = watchlist.filter(m => m.id !== id);
  renderWatchlist();
  if(selectedMovie && selectedMovie.id === id) updateWatchlistBtn();
}

function filterByTag(tag) {
  if(!tag) {
    renderMovies();
    return;
  }
  openFilteredPage(tag);
}

document.getElementById("search").addEventListener("input", function(){
  const q = this.value.toLowerCase().trim();
  const sugBox = document.getElementById("suggestions");
  sugBox.innerHTML = "";
  if(!q){
    sugBox.style.display = "none";
    return;
  }
  const matches = movies.filter(movie => movie.title.toLowerCase().includes(q));
  if(matches.length > 0){
    sugBox.style.display = "block";
    matches.forEach(movie => {
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.textContent = movie.title;
      item.onclick = function(){
        openMovie(movie);
        sugBox.style.display = "none";
      };
      sugBox.appendChild(item);
    });
  } else {
    sugBox.style.display = "none";
  }
});

document.addEventListener("click", function(e){
  if(!e.target.closest(".search-container")){
    document.getElementById("suggestions").style.display = "none";
  }
});
</script>
</body>
</html>
