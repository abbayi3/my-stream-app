<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Hub</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: sans-serif; padding: 16px; margin: 0; }
        h1 { color: #ef4444; text-align: center; font-size: 24px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #1e293b; border-radius: 8px; overflow: hidden; padding: 10px; border: 1px solid #334155; }
        .iframe-container { position: relative; width: 100%; height: 200px; background-color: #000; border-radius: 6px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .title { font-size: 14px; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e2e8f0; }
        .status { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 40px; }
    </style>
</head>
<body>

    <h1>VIDEO HUB</h1>
    <div id="status" class="status">Loading videos...</div>
    <div id="video-grid" class="grid"></div>

    <script>
        const API_KEY = "576426plhliaz78wwydsib";
        const DOOD_URL = `https://doodapi.co/api/file/list?key=${API_KEY}`;
        const PROXY_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(DOOD_URL)}`;

        async function fetchVideos() {
            const statusDiv = document.getElementById("status");
            const gridDiv = document.getElementById("video-grid");

            try {
                const response = await fetch(PROXY_URL);
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);

                if (data.status === 200 && data.result && data.result.files && data.result.files.length > 0) {
                    statusDiv.style.display = "none";
                    gridDiv.innerHTML = "";

                    data.result.files.forEach(file => {
                        const embedUrl = `https://dood.to/e/${file.file_code}`;
                        const card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <div class="iframe-container">
                                <iframe src="${embedUrl}" allowfullscreen></iframe>
                            </div>
                            <div class="title" title="${file.title}">${file.title}</div>
                        `;
                        gridDiv.appendChild(card);
                    });
                } else if (data.status === 200 && data.result && data.result.files.length === 0) {
                    statusDiv.innerText = "Account active! No videos uploaded yet in your Doodstream account.";
                } else {
                    statusDiv.innerText = "API Response: " + (data.msg || "Error fetching data");
                }
            } catch (error) {
                console.error("Fetch error:", error);
                statusDiv.innerText = "Connection error. Retrying...";
            }
        }

        fetchVideos();
    </script>
</body>
</html>
